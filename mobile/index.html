<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0b1f3a"
    >

    <title>Album Tablic</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #0b1f3a;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            overflow: hidden;
        }


        /* =========================================
           EKRAN STARTOWY
           ========================================= */

        .loading-screen {

            width: 100%;
            min-height: 100vh;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding: 30px;

            text-align: center;
        }


        /* =========================================
           LOGO
           ========================================= */

        .logo {

            width: min(240px, 65vw);
            height: auto;

            margin-bottom: 35px;

            object-fit: contain;
        }


        /* =========================================
           TYTUŁ
           ========================================= */

        .title {

            margin: 0 0 8px 0;

            font-size: clamp(
                26px,
                7vw,
                42px
            );

            font-weight: 900;

            letter-spacing: 2px;

            text-transform: uppercase;
        }


        .subtitle {

            margin: 0 0 35px 0;

            font-size: 14px;

            letter-spacing: 2px;

            opacity: 0.7;

            text-transform: uppercase;
        }


        /* =========================================
           PASEK
           ========================================= */

        .progress-container {

            width: min(360px, 85vw);

            height: 18px;

            background: rgba(
                255,
                255,
                255,
                0.12
            );

            border: 2px solid rgba(
                255,
                255,
                255,
                0.35
            );

            padding: 2px;

            border-radius: 3px;

            overflow: hidden;
        }


        .progress-bar {

            width: 0%;

            height: 100%;

            background: #ffffff;

            transition:
                width 0.35s ease;

            border-radius: 1px;
        }


        /* =========================================
           TEKST ŁADOWANIA
           ========================================= */

        .loading-status {

            margin-top: 18px;

            min-height: 20px;

            font-size: 13px;

            letter-spacing: 1px;

            opacity: 0.8;

            text-transform: uppercase;
        }


        .loading-percent {

            margin-top: 8px;

            font-size: 12px;

            opacity: 0.5;

            letter-spacing: 1px;
        }


        /* =========================================
           ANIMACJA
           ========================================= */

        .dots::after {

            content: "";

            animation:
                dots 1.4s infinite;

        }


        @keyframes dots {

            0% {
                content: "";
            }

            33% {
                content: ".";
            }

            66% {
                content: "..";
            }

            100% {
                content: "...";
            }

        }


        /* =========================================
           STOPKA
           ========================================= */

        .footer {

            position: fixed;

            bottom: 20px;

            left: 0;
            right: 0;

            text-align: center;

            font-size: 10px;

            letter-spacing: 1px;

            opacity: 0.35;

            text-transform: uppercase;
        }

    </style>
</head>


<body>


    <main class="loading-screen">


        <!--
            JEŻELI MASZ LOGO:
            mobile/logo.png

            to zostawiamy tę ścieżkę.
        -->

        <img
            src="./logo.png"
            alt="Album Tablic"
            class="logo"
            onerror="this.style.display='none';"
        >


        <h1 class="title">
            Album Tablic
        </h1>


        <p class="subtitle">
            Kolekcja 2026
        </p>


        <div class="progress-container">

            <div
                id="progress-bar"
                class="progress-bar"
            ></div>

        </div>


        <div
            id="loading-status"
            class="loading-status"
        >
            Uruchamianie aplikacji<span class="dots"></span>
        </div>


        <div
            id="loading-percent"
            class="loading-percent"
        >
            0%
        </div>


    </main>


    <div class="footer">
        JjakJamnik · Album Tablic
    </div>


    <script>

        /*
        =====================================================
        ALBUM TABLIC
        EKRAN STARTOWY MOBILE

        Ten plik NIE ładuje bazy.

        Jego zadaniem jest tylko pokazanie
        eleganckiego ekranu startowego, a następnie
        przejście do właściwego albumu.
        =====================================================
        */


        const progressBar =
            document.getElementById(
                "progress-bar"
            );


        const loadingStatus =
            document.getElementById(
                "loading-status"
            );


        const loadingPercent =
            document.getElementById(
                "loading-percent"
            );


        let progress = 0;


        function setProgress(
            value,
            text
        ) {

            progress =
                Math.max(
                    0,
                    Math.min(
                        100,
                        value
                    )
                );


            progressBar.style.width =
                progress + "%";


            loadingPercent.textContent =
                Math.round(progress) + "%";


            if (text) {

                loadingStatus.innerHTML =
                    text +
                    '<span class="dots"></span>';

            }

        }


        /*
        =====================================================
        START
        =====================================================
        */

        setProgress(
            10,
            "Uruchamianie aplikacji"
        );


        setTimeout(
            function () {

                setProgress(
                    30,
                    "Łączenie z bazą"
                );

            },
            350
        );


        setTimeout(
            function () {

                setProgress(
                    50,
                    "Wczytywanie kolekcji"
                );

            },
            750
        );


        setTimeout(
            function () {

                setProgress(
                    70,
                    "Przygotowywanie albumu"
                );

            },
            1150
        );


        setTimeout(
            function () {

                setProgress(
                    85,
                    "Ładowanie interfejsu"
                );

            },
            1550
        );


        setTimeout(
            function () {

                setProgress(
                    100,
                    "Gotowe"
                );

            },
            1900
        );


        /*
        =====================================================
        PRZEJŚCIE DO PRAWDZIWEGO ALBUMU
        =====================================================
        */

        setTimeout(
            function () {

                window.location.replace(
                    "../index.html"
                );

            },
            2250
        );

    </script>


</body>
</html>
