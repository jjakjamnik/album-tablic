
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Album tablic — Europa</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="stickers.css">
    <link rel="stylesheet" href="plates.css">

    <!-- W albumie globalnym karty są tylko do oglądania -->
    <style>
        body[data-page-type="album"] .sticker-actions {
            display: none !important;
        }
    </style>
</head>

<body data-page-type="album" data-album-view="all">

<div class="album album-v3" data-country="AL">

    <!-- NAGŁÓWEK -->
    <header class="country-header album-v3-header">

        <div>
            <div class="country-title">
                ALBUM TABLIC
            </div>

            <div class="album-subtitle">
                EUROPEJSKA KOLEKCJA · ALBUM 3.0
            </div>
        </div>

        <a href="index.html" class="country-back">
            ← SPIS TREŚCI
        </a>

    </header>


    <main class="album-v3-main">

        <!-- ROZKŁADÓWKA -->
        <div id="album-spread" class="album-spread">

            <!-- LEWA STRONA -->
            <section
                class="album-page album-page-left"
                data-page-side="left"
            >

                <header class="album-page-header">

                    <div class="album-page-identity">

                        <span
                            id="left-country-flag"
                            class="album-page-flag"
                        >🇦🇱</span>

                        <div>
                            <div
                                id="left-country-title"
                                class="album-page-title"
                            >ALBANIA</div>

                            <div class="album-page-subtitle">
                                EUROPEAN REGISTRATION PLATES
                            </div>
                        </div>

                    </div>

                    <span
                        class="album-page-code"
                        id="left-country-code"
                    >AL</span>

                </header>

                <section
                    id="left-sticker-grid"
                    class="sticker-grid album-page-grid"
                ></section>

                <footer class="album-page-footer">
                    <span id="left-page-country">ALBANIA</span>
                    <span>·</span>
                    <span id="left-page-number">001–030</span>
                </footer>

            </section>


            <!-- PRAWA STRONA -->
            <section
                class="album-page album-page-right"
                data-page-side="right"
            >

                <header class="album-page-header">

                    <div class="album-page-identity">

                        <span
                            id="right-country-flag"
                            class="album-page-flag"
                        >🇦🇱</span>

                        <div>
                            <div
                                id="right-country-title"
                                class="album-page-title"
                            >ALBANIA</div>

                            <div class="album-page-subtitle">
                                EUROPEAN REGISTRATION PLATES
                            </div>
                        </div>

                    </div>

                    <span
                        class="album-page-code"
                        id="right-country-code"
                    >AL</span>

                </header>

                <section
                    id="right-sticker-grid"
                    class="sticker-grid album-page-grid"
                ></section>

                <footer class="album-page-footer">
                    <span id="right-page-country">ALBANIA</span>
                    <span>·</span>
                    <span id="right-page-number">031–060</span>
                </footer>

            </section>

        </div>


        <!-- KONTENER ZGODNOŚCI ZE STARYM SYSTEMEM -->
        <section
            id="sticker-grid"
            class="sticker-grid album-legacy-grid"
            hidden
        ></section>

    </main>


    <footer class="album-footer">
        ALBUM TABLIC REJESTRACYJNYCH
        <span>·</span>
        EUROPA
        <span>·</span>
        3.0
    </footer>

</div>


<!-- SKRYPTY ALBUMU -->
<script src="polska.js"></script>
<script src="niemcy.js"></script>
<script src="distance.js"></script>
<script src="cards.js"></script>
<script src="script.js"></script>

</body>
</html>
