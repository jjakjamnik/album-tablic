<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0b1f3a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icons/favicon.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">

    <title>Album Tablic – Europejska Kolekcja</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="stickers.css">
    <link rel="stylesheet" href="plates.css">
    <link href="https://fonts.cdnfonts.com/css/keep-calm" rel="stylesheet">

    <style>
        body.album-index {
            min-height: 100vh;
            margin: 0;
            padding: 1px 0;
            background:
                radial-gradient(
                    circle at 50% 20%,
                    #51402d 0%,
                    #30251b 48%,
                    #17120e 100%
                );
            color: #eadfc8;
            font-family: Arial, sans-serif;
        }

        .index-v3 {
            width: min(1180px, calc(100% - 32px));
            margin: 35px auto;
        }

        /* OKŁADKA */

        .index-cover {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 390px;
            padding: 55px 35px;
            box-sizing: border-box;
            overflow: hidden;

            background:
                linear-gradient(
                    145deg,
                    #6b5236 0%,
                    #3d2c1e 48%,
                    #241a12 100%
                );

            border: 3px double #b99b68;
            border-radius: 12px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.55),
                inset 0 0 35px rgba(0, 0, 0, 0.35);

            text-align: center;
        }

        .index-cover::before {
            content: "";
            position: absolute;
            inset: 12px;
            border: 1px solid rgba(218, 190, 139, 0.45);
            border-radius: 6px;
            pointer-events: none;
        }

        .index-cover::after {
            content: "";
            position: absolute;
            inset: 19px;
            border: 1px solid rgba(218, 190, 139, 0.18);
            border-radius: 4px;
            pointer-events: none;
        }

        .cover-edition {
            position: relative;
            z-index: 1;
            margin-bottom: 22px;
            color: #d3b77f;
            font-size: 12px;
            letter-spacing: 4px;
            font-weight: bold;
        }

        .cover-title {
            position: relative;
            z-index: 1;
            margin: 0;
            color: #f1dfb8;
            font-family: "Keep Calm", Georgia, serif;
            font-size: clamp(38px, 7vw, 76px);
            line-height: 1.15;
            letter-spacing: 5px;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.6);
        }

        .cover-subtitle {
            position: relative;
            z-index: 1;
            margin-top: 15px;
            color: #d4bd91;
            font-size: 17px;
            letter-spacing: 6px;
        }

        .cover-divider {
            position: relative;
            z-index: 1;
            width: 150px;
            height: 1px;
            margin: 28px auto;
            background: linear-gradient(
                90deg,
                transparent,
                #c6a66c,
                transparent
            );
        }

        .cover-description {
            position: relative;
            z-index: 1;
            max-width: 650px;
            margin: 0 auto 30px;
            color: #e0d1b5;
            font-size: 15px;
            line-height: 1.8;
        }

        /* PRZYCISK OTWIERANIA ALBUMU */

        .open-album-button {
            position: relative;
            z-index: 1;
            display: inline-block;
            padding: 15px 34px;

            background: linear-gradient(
                180deg,
                #d6bd89,
                #a98a55
            );

            color: #261b11;
            border: 1px solid #e6d3a9;
            border-radius: 5px;

            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            text-decoration: none;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.35);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .open-album-button:hover {
            transform: translateY(-3px);
            background: linear-gradient(
                180deg,
                #ead7ac,
                #c4a46d
            );
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
        }

        /* STOPKA */

        .index-footer {
            margin-top: 25px;
            padding: 15px;
            color: #a99779;
            font-size: 11px;
            letter-spacing: 2px;
            text-align: center;
        }

        /* TELEFONY */

        @media (max-width: 520px) {
            .index-v3 {
                width: calc(100% - 20px);
                margin: 10px auto;
            }

            .index-cover {
                min-height: 350px;
                padding: 45px 20px;
            }

            .cover-edition {
                font-size: 9px;
                letter-spacing: 2px;
            }

            .cover-title {
                font-size: 38px;
                letter-spacing: 2px;
            }

            .cover-subtitle {
                font-size: 12px;
                letter-spacing: 3px;
            }

            .cover-description {
                font-size: 13px;
            }

            .open-album-button {
                padding: 13px 22px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body class="album-index">

    <main class="album index-v3">

        <header class="index-cover">

            <div class="cover-edition">
                EUROPEAN REGISTRATION PLATES COLLECTION
            </div>

            <h1 class="cover-title">
                ALBUM TABLIC
            </h1>

            <div class="cover-subtitle">
                EUROPEJSKA KOLEKCJA
            </div>

            <div class="cover-divider"></div>

            <p class="cover-description">
                Prywatna kolekcja europejskich tablic rejestracyjnych.
                Każda znaleziona tablica to kolejna historia,
                kolejne miejsce i kolejna strona albumu.
            </p>

            <a href="album.html" class="open-album-button">
                OTWÓRZ ALBUM →
            </a>

        </header>

        <footer class="index-footer">
            EUROPEAN REGISTRATION PLATES COLLECTION
        </footer>

    </main>


<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js", { scope: "./" })
            .catch(function (error) {
                console.error("Nie udało się uruchomić trybu aplikacji:", error);
            });
    });
}
</script>

</body>
</html>
