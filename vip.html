
<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Karty specjalne VIP — Album tablic</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="stickers.css">
    <link rel="stylesheet" href="plates.css">
</head>

<body data-album-view="special">

<div class="album">

    <!-- NAGŁÓWEK -->

    <header class="country-header">

        <div>
            <div class="country-title">
                KARTY SPECJALNE
            </div>

            <div class="album-subtitle">
                ALBUM TABLIC REJESTRACYJNYCH · VIP
            </div>
        </div>

        <a href="index.html" class="country-back">
            ← ALBUM
        </a>

    </header>

    <!-- GŁÓWNA ZAWARTOŚĆ -->

    <main>

        <div class="index-heading">

            <span>
                KOLEKCJA SPECJALNA
            </span>

            <div class="index-heading-line"></div>

            <small id="country-sticker-count">
                0 KART
            </small>

        </div>

        <section
            id="sticker-grid"
            class="sticker-grid">
        </section>

    </main>

    <!-- STOPKA -->

    <footer class="album-footer">

        ALBUM TABLIC REJESTRACYJNYCH
        <span>·</span>
        KARTY SPECJALNE
        <span>·</span>
        VIP

    </footer>

</div>

<!-- JAVASCRIPT -->

<script src="polska.js"></script>
<script src="niemcy.js"></script>
<script src="distance.js"></script>
<script src="cards.js"></script>
<script src="script.js"></script>

</body>
</html>
