<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#0b1f3a">

    <title>Rejestracja — Album Tablic</title>

    <link rel="stylesheet" href="style.css">


    <style>

        /* ==================================================
           REJESTRACJA — ALBUM TABLIC
           ================================================== */

        .auth-page {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 20px;

            box-sizing: border-box;

        }


        .auth-box {

            width: 100%;
            max-width: 430px;

            background: #ffffff;

            border: 1px solid rgba(11, 31, 58, 0.15);

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.15);

            padding: 40px;

            box-sizing: border-box;

        }


        .auth-header {

            text-align: center;

            margin-bottom: 32px;

        }


        .auth-logo {

            font-size: 14px;

            font-weight: 700;

            letter-spacing: 3px;

            color: #b08a3c;

            margin-bottom: 12px;

        }


        .auth-title {

            margin: 0;

            color: #0b1f3a;

            font-size: 32px;

            font-weight: 800;

            letter-spacing: 1px;

        }


        .auth-subtitle {

            margin-top: 8px;

            color: #777;

            font-size: 13px;

            letter-spacing: 1px;

        }


        .auth-form {

            display: flex;

            flex-direction: column;

            gap: 18px;

        }


        .auth-field {

            display: flex;

            flex-direction: column;

            gap: 7px;

        }


        .auth-field label {

            color: #0b1f3a;

            font-size: 13px;

            font-weight: 700;

            letter-spacing: 0.5px;

        }


        .auth-field input {

            width: 100%;

            box-sizing: border-box;

            padding: 13px 14px;

            border: 1px solid #ccd2da;

            background: #fafafa;

            color: #0b1f3a;

            font-size: 15px;

            outline: none;

            transition: 0.2s ease;

        }


        .auth-field input:focus {

            border-color: #b08a3c;

            background: #ffffff;

            box-shadow:
                0 0 0 2px rgba(176, 138, 60, 0.12);

        }


        .auth-button {

            margin-top: 6px;

            width: 100%;

            padding: 14px;

            border: none;

            background: #0b1f3a;

            color: #ffffff;

            font-size: 14px;

            font-weight: 800;

            letter-spacing: 1px;

            cursor: pointer;

            transition: 0.2s ease;

        }


        .auth-button:hover {

            background: #142e52;

        }


        .auth-button:disabled {

            opacity: 0.6;

            cursor: wait;

        }


        .auth-message {

            display: none;

            padding: 12px;

            font-size: 13px;

            line-height: 1.5;

            text-align: center;

        }


        .auth-message.error {

            display: block;

            background: #f8eaea;

            color: #8b2222;

            border: 1px solid #e5bcbc;

        }


        .auth-message.success {

            display: block;

            background: #eaf6ed;

            color: #216b32;

            border: 1px solid #b9ddc1;

        }


        .auth-links {

            margin-top: 26px;

            padding-top: 22px;

            border-top: 1px solid #e4e7eb;

            text-align: center;

            font-size: 13px;

            color: #777;

        }


        .auth-links a {

            color: #0b1f3a;

            font-weight: 700;

            text-decoration: none;

        }


        .auth-links a:hover {

            color: #b08a3c;

        }


        .auth-footer {

            margin-top: 28px;

            text-align: center;

            color: #999;

            font-size: 10px;

            letter-spacing: 1px;

        }


        @media (max-width: 500px) {

            .auth-box {

                padding: 28px 22px;

            }

            .auth-title {

                font-size: 27px;

            }

        }

    </style>

</head>


<body>


<div class="auth-page">


    <div class="auth-box">


        <!-- ==================================================
             NAGŁÓWEK
             ================================================== -->

        <div class="auth-header">

            <div class="auth-logo">
                ALBUM TABLIC
            </div>

            <h1 class="auth-title">
                REJESTRACJA
            </h1>

            <div class="auth-subtitle">
                STWÓRZ SWOJĄ KOLEKCJĘ
            </div>

        </div>



        <!-- ==================================================
             FORMULARZ
             ================================================== -->

        <form
            id="register-form"
            class="auth-form"
        >


            <div class="auth-field">

                <label for="register-email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="register-email"
                    name="email"
                    placeholder="twoj@email.pl"
                    autocomplete="email"
                    required
                >

            </div>



            <div class="auth-field">

                <label for="register-password">
                    Hasło
                </label>

                <input
                    type="password"
                    id="register-password"
                    name="password"
                    placeholder="Minimum 6 znaków"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>



            <div class="auth-field">

                <label for="register-password-confirm">
                    Powtórz hasło
                </label>

                <input
                    type="password"
                    id="register-password-confirm"
                    name="password-confirm"
                    placeholder="Powtórz hasło"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>



            <div
                id="register-message"
                class="auth-message">
            </div>



            <button
                type="submit"
                id="register-button"
                class="auth-button"
            >
                UTWÓRZ KONTO
            </button>


        </form>



        <!-- ==================================================
             LOGOWANIE
             ================================================== -->

        <div class="auth-links">

            Masz już konto?

            <a href="login.html">
                ZALOGUJ SIĘ
            </a>

        </div>



        <!-- ==================================================
             STOPKA
             ================================================== -->

        <div class="auth-footer">

            ALBUM TABLIC REJESTRACYJNYCH
            <span>·</span>
            KOLEKCJA 2026

        </div>


    </div>


</div>



<!-- ==================================================
     JAVASCRIPT
     ================================================== -->

<!--
    auth.js dodamy później.
-->


</body>

</html>
