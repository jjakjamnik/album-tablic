<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dania — Album tablic</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../stickers.css">
    <link rel="stylesheet" href="../plates.css">

</head>


<body>


<div class="album">


    <!-- ==================================================
         NAGŁÓWEK
         ================================================== -->

    <header class="country-header">

        <div>

            <div class="country-title">
                DANIA
            </div>

            <div class="album-subtitle">
                TABLICE REJESTRACYJNE · DK
            </div>

        </div>


        <a
            href="../index.html"
            class="country-back"
        >
            ← ALBUM
        </a>

    </header>



    <!-- ==================================================
         GŁÓWNA ZAWARTOŚĆ
         ================================================== -->

    <main>


        <div class="index-heading">

            <span>
                DANIA
            </span>

            <div class="index-heading-line"></div>

            <small id="country-sticker-count">
                0 NAKLEJEK
            </small>

        </div>



        <!-- ==================================================
             NAKLEJKI

             Karty są generowane automatycznie
             przez script.js na podstawie Local Storage.

             Jeżeli kraj nie ma jeszcze żadnej naklejki,
             script.js pokaże komunikat:

             W TEJ CHWILI ALBUM JEST PUSTY
             ================================================== -->

        <section
            id="sticker-grid"
            class="sticker-grid"
        >
        </section>


    </main>



    <!-- ==================================================
         STOPKA
         ================================================== -->

    <footer class="album-footer">

        ALBUM TABLIC REJESTRACYJNYCH

        <span>·</span>

        NAZWA KRAJU

        <span>·</span>

        XX

    </footer>


</div>



<!-- ==================================================
     JAVASCRIPT
     ================================================== -->

<script src="../polska.js"></script>
<script src="../niemcy.js"></script>
<script src="../distance.js"></script>
<script src="../cards.js"></script>
<script src="../script.js"></script>


</body>

</html>
